<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Event Feedback & Rating')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container mb-6 mt-4 max-w-lg" style="max-width: 650px; margin: 30px auto;">
    <div class="card">
        <div class="card-header">
            <h2>Post-Event Feedback & Rating</h2>
            <p class="text-sm text-muted mt-1">Your feedback helps college organizers evaluate session quality and refine future campus events.</p>
        </div>
        <div class="card-body">
            <div class="mb-4 p-3" style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;">
                <h4 style="margin: 0 0 6px 0;" th:text="${event.title}">Event Title</h4>
                <div class="text-sm text-muted">
                    Venue: <span th:text="${event.venue}">Venue</span> &middot; 
                    Date: <span th:text="${#temporals.format(event.startDatetime, 'MMM dd, yyyy')}">Date</span>
                </div>
            </div>

            <div th:if="${alreadySubmitted}" class="alert alert-info">
                <strong>Feedback Already Recorded</strong>
                <p class="text-sm mt-1">
                    You have already submitted a rating of <strong th:text="${existingFeedback.rating} + ' / 5 ★'">5 / 5 ★</strong> for this event.
                </p>
                <p class="text-sm text-muted italic mt-2" th:if="${existingFeedback.comments != null && !#strings.isEmpty(existingFeedback.comments)}"
                   th:text="'“' + ${existingFeedback.comments} + '”'">Comments</p>
                <div class="mt-3">
                    <a th:href="@{/student/dashboard}" class="btn btn-sm btn-primary">Back to Dashboard</a>
                </div>
            </div>

            <form th:unless="${alreadySubmitted}" th:action="@{/student/feedback/{id}(id=${registration.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group mb-4">
                    <label class="form-label">How would you rate this event? <span class="text-danger">*</span></label>
                    <div class="flex gap-4 items-center mt-2" style="font-size: 1.1rem;">
                        <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;">
                            <input type="radio" name="rating" value="5" checked /> ★★★★★ (5 - Excellent)
                        </label>
                    </div>
                    <div class="flex gap-4 items-center mt-2">
                        <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;">
                            <input type="radio" name="rating" value="4" /> ★★★★☆ (4 - Good)
                        </label>
                    </div>
                    <div class="flex gap-4 items-center mt-2">
                        <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;">
                            <input type="radio" name="rating" value="3" /> ★★★☆☆ (3 - Average)
                        </label>
                    </div>
                    <div class="flex gap-4 items-center mt-2">
                        <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;">
                            <input type="radio" name="rating" value="2" /> ★★☆☆☆ (2 - Below Expectations)
                        </label>
                    </div>
                    <div class="flex gap-4 items-center mt-2">
                        <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;">
                            <input type="radio" name="rating" value="1" /> ★☆☆☆☆ (1 - Poor)
                        </label>
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label class="form-label">Comments & Suggestions (Optional)</label>
                    <textarea name="comments" class="form-control" rows="4" placeholder="What did you like about the event? Any suggestions for improvement?"></textarea>
                </div>

                <div class="flex justify-between items-center mt-4">
                    <a th:href="@{/student/dashboard}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Submit Verified Feedback</button>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
