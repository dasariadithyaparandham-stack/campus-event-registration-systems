<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('My Profile')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container mb-6 mt-4" style="max-width: 650px;">
    <div style="margin-bottom: 20px;">
        <a th:href="@{/student/dashboard}" class="btn btn-sm btn-secondary">&larr; Back to Dashboard</a>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>Student Profile Information</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/student/profile}" th:object="${profileDto}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label class="form-label">Email Address (Read-only)</label>
                    <input type="text" class="form-control" th:value="${user.email}" readonly style="background-color: #f1f5f9; cursor: not-allowed;">
                </div>

                <div class="form-group">
                    <label class="form-label" for="fullName">Full Name</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" required>
                    <div class="form-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Invalid name</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="studentIdNumber">Student ID / Roll Number</label>
                    <input type="text" id="studentIdNumber" th:field="*{studentIdNumber}" class="form-control" placeholder="e.g. STU-2024-001">
                </div>

                <div class="form-group">
                    <label class="form-label" for="department">Academic Department</label>
                    <input type="text" id="department" th:field="*{department}" class="form-control" placeholder="e.g. Computer Science & Engineering">
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">Contact Phone Number</label>
                    <input type="tel" id="phone" th:field="*{phone}" class="form-control" placeholder="e.g. +91 9876543210">
                </div>

                <div class="mt-4 flex gap-3">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a th:href="@{/student/dashboard}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
