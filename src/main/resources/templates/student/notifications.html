<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('In-App Notification Center')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container mb-6 mt-4 max-w-lg" style="max-width: 800px; margin: 30px auto;">
    <div class="flex justify-between items-center mb-4">
        <div>
            <h2>Notification Center</h2>
            <p class="text-muted text-sm">Real-time alerts, waitlist promotions, registration confirmations & attendance updates.</p>
        </div>
        <div th:if="${unreadCount > 0}">
            <form th:action="@{/student/notifications/read-all}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-sm btn-outline">Mark All as Read</button>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(notifications)}" class="text-center text-muted" style="padding: 40px;">
                <div style="font-size: 2.5rem; margin-bottom: 8px;">🔔</div>
                <h3>No Notifications</h3>
                <p class="text-sm">You are all caught up! New notifications regarding your registrations and waitlists will appear here.</p>
            </div>

            <div th:unless="${#lists.isEmpty(notifications)}" class="flex flex-col gap-3">
                <div th:each="n : ${notifications}" 
                     class="p-3" 
                     th:style="'border-radius: 8px; border: 1px solid #e2e8f0; ' + (${!n.readStatus} ? 'background: #f0fdf4; border-left: 4px solid #22c55e;' : 'background: #ffffff;')">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="badge" 
                                      th:classappend="${n.notificationType == 'WAITING' || n.notificationType == 'WAITLIST_OFFER' ? 'badge-warning' : (n.notificationType == 'ATTENDANCE_RECORDED' ? 'badge-success' : 'badge-info')}"
                                      th:text="${n.notificationType}">TYPE</span>
                                <strong th:text="${n.subject}">Notification Subject</strong>
                            </div>
                            <p class="text-sm mt-1" style="color: #334155;" th:text="${n.message}">Message body</p>
                            <span class="text-xs text-muted" th:text="${#temporals.format(n.createdAt, 'MMM dd, yyyy · hh:mm a')}">Time</span>
                        </div>
                        <div th:if="${!n.readStatus}">
                            <form th:action="@{/student/notifications/{id}/read(id=${n.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="btn btn-sm btn-secondary" style="font-size: 0.75rem; padding: 2px 8px;">Mark Read</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
