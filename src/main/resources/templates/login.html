<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Log In')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container" style="max-width: 480px; margin: 40px auto;">
    <div class="card">
        <div class="card-header text-center" style="display: block; padding: 24px 20px 16px;">
            <h2>Welcome Back</h2>
            <p class="text-muted text-sm mt-1">Sign in to your college account to manage event registrations</p>
        </div>

        <div class="card-body">
            <!-- Login Error / Logout Messages -->
            <div th:if="${loginError}" class="alert alert-danger" th:text="${loginError}">Invalid credentials</div>
            <div th:if="${logoutSuccess}" class="alert alert-success" th:text="${logoutSuccess}">Logged out</div>
            <div th:if="${signupSuccess}" class="alert alert-success" th:text="${signupSuccess}">Account created</div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label class="form-label" for="email">Campus Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="e.g. john.doe@campus.edu" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Log In</button>
                </div>
            </form>

            <div class="text-center mt-4 text-sm">
                <span class="text-muted">Don't have an account yet?</span>
                <a th:href="@{/register}" class="font-semibold">Sign Up as Student</a>
            </div>
        </div>

        <!-- Demo Credentials Helper -->
        <div class="card-footer" style="background-color: #f1f5f9; font-size: 0.85rem;">
            <div class="font-semibold mb-1" style="color: #0f172a;">Quick Demo Credentials:</div>
            <div style="color: #475569;">
                <div><strong>Administrator:</strong> <code>admin@campus.edu</code> / <code>Admin@123</code></div>
                <div><strong>Student:</strong> <code>john.doe@campus.edu</code> / <code>Student@123</code></div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
