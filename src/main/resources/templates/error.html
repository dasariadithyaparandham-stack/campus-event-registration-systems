<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Error')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<main class="container text-center" style="max-width: 550px; margin: 80px auto;">
    <div class="card" style="padding: 40px 30px;">
        <div style="font-size: 3.5rem; font-weight: 800; color: var(--primary);" th:text="${errorCode ?: 500}">404</div>
        <h2 class="mt-2" th:text="${errorTitle ?: 'Unexpected Error'}">Page Not Found</h2>
        <p class="text-muted mt-2" th:text="${errorMessage ?: 'The requested page or resource could not be found.'}">
            Please check the URL or return to the campus events portal.
        </p>

        <div class="mt-6 flex justify-center gap-3">
            <a th:href="@{/}" class="btn btn-primary">Return Home</a>
            <a th:href="@{/events}" class="btn btn-secondary">Browse Events</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
