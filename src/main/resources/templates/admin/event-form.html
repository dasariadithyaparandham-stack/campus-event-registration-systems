<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header(${isEdit ? 'Edit Event' : 'Create Event'})}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container mb-6 mt-4" style="max-width: 800px;">
    <div style="margin-bottom: 20px;">
        <a th:href="@{/admin/events}" class="btn btn-sm btn-secondary">&larr; Back to Events</a>
    </div>

    <div class="card">
        <div class="card-header">
            <h2 th:text="${isEdit ? 'Edit Event: ' + event.title : 'Create New Campus Event'}">Event Form</h2>
        </div>
        <div class="card-body">
            <form th:action="${isEdit ? '/admin/events/' + event.id + '/edit' : '/admin/events/new'}" th:object="${eventForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label class="form-label" for="title">Event Title <span style="color: var(--danger);">*</span></label>
                    <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="e.g. National Hackathon 2026" required>
                    <div class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Invalid title</div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label" for="category">Category <span style="color: var(--danger);">*</span></label>
                        <input type="text" id="category" th:field="*{category}" class="form-control" placeholder="TECHNICAL, WORKSHOP, CULTURAL..." required list="categoriesList">
                        <datalist id="categoriesList">
                            <option value="TECHNICAL">TECHNICAL</option>
                            <option value="WORKSHOP">WORKSHOP</option>
                            <option value="SEMINAR">SEMINAR</option>
                            <option value="HACKATHON">HACKATHON</option>
                            <option value="CULTURAL">CULTURAL</option>
                            <option value="SPORTS">SPORTS</option>
                            <option value="PLACEMENT">PLACEMENT</option>
                        </datalist>
                        <div class="form-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Invalid category</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="venue">Venue / Location <span style="color: var(--danger);">*</span></label>
                        <input type="text" id="venue" th:field="*{venue}" class="form-control" placeholder="e.g. Main Auditorium" required>
                        <div class="form-error" th:if="${#fields.hasErrors('venue')}" th:errors="*{venue}">Invalid venue</div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">Detailed Description <span style="color: var(--danger);">*</span></label>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="5" placeholder="Provide full event overview, rules, schedule, prerequisites..." required></textarea>
                    <div class="form-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Invalid description</div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label" for="startDatetime">Start Date & Time <span style="color: var(--danger);">*</span></label>
                        <input type="datetime-local" id="startDatetime" th:field="*{startDatetime}" class="form-control" required>
                        <div class="form-error" th:if="${#fields.hasErrors('startDatetime')}" th:errors="*{startDatetime}">Required</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="endDatetime">End Date & Time</label>
                        <input type="datetime-local" id="endDatetime" th:field="*{endDatetime}" class="form-control">
                        <div class="form-error" th:if="${#fields.hasErrors('endDatetime')}" th:errors="*{endDatetime}">Invalid end time</div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label" for="registrationDeadline">Registration Deadline <span style="color: var(--danger);">*</span></label>
                        <input type="datetime-local" id="registrationDeadline" th:field="*{registrationDeadline}" class="form-control" required>
                        <div class="form-error" th:if="${#fields.hasErrors('registrationDeadline')}" th:errors="*{registrationDeadline}">Required</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="capacity">Seat Capacity <span style="color: var(--danger);">*</span></label>
                        <input type="number" id="capacity" th:field="*{capacity}" class="form-control" min="1" required>
                        <div class="form-error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}">Invalid capacity</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="status">Initial Status</label>
                        <select id="status" th:field="*{status}" class="form-control">
                            <option value="DRAFT">DRAFT</option>
                            <option value="OPEN">OPEN</option>
                            <option value="CLOSED">CLOSED</option>
                        </select>
                    </div>
                </div>

                <div class="mt-4 flex gap-3">
                    <button type="submit" class="btn btn-primary" th:text="${isEdit ? 'Update Event' : 'Create & Publish Event'}">Submit</button>
                    <a th:href="@{/admin/events}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
