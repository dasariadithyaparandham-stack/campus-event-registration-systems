<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Student Registration')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container" style="max-width: 600px; margin: 40px auto;">
    <div class="card">
        <div class="card-header text-center" style="display: block; padding: 24px 20px 16px;">
            <h2>Student Account Registration</h2>
            <p class="text-muted text-sm mt-1">Create your student account to register for events and receive digital tickets</p>
        </div>

        <div class="card-body">
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">Registration error</div>

            <form th:action="@{/register}" th:object="${userDto}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label class="form-label" for="fullName">Full Name <span style="color: var(--danger);">*</span></label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="e.g. Alex Kumar" required>
                    <div class="form-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Invalid name</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">College Email Address <span style="color: var(--danger);">*</span></label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="e.g. alex.kumar@campus.edu" required>
                    <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Invalid email</div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label" for="studentIdNumber">Student ID / Roll No.</label>
                        <input type="text" id="studentIdNumber" th:field="*{studentIdNumber}" class="form-control" placeholder="e.g. STU-2024-045">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="department">Department</label>
                        <input type="text" id="department" th:field="*{department}" class="form-control" placeholder="e.g. Computer Science">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input type="tel" id="phone" th:field="*{phone}" class="form-control" placeholder="e.g. +91 9876543210">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label" for="password">Password <span style="color: var(--danger);">*</span></label>
                        <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Min. 6 characters" required>
                        <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Invalid password</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">Confirm Password <span style="color: var(--danger);">*</span></label>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="Re-enter password" required>
                        <div class="form-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Password mismatch</div>
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Create Student Account</button>
                </div>
            </form>

            <div class="text-center mt-4 text-sm">
                <span class="text-muted">Already registered?</span>
                <a th:href="@{/login}" class="font-semibold">Log In here</a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
