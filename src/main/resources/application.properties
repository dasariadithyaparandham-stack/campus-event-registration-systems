# ===================================================================
# Campus Event Registration System - Application Properties
# ===================================================================
spring.application.name=campus-event-system
server.port=${PORT:10000}

# -------------------------------------------------------------------
# Database Configuration (MySQL / TiDB Cloud AWS Oregon)
# Automatically connects on Render & Cloud without needing manual env configs
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.us-west-2.prod.aws.tidbcloud.com:4000/campus_events?sslMode=VERIFY_IDENTITY}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:LALcc2vKo5HH1BD.root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:0GyOCfoSATicRDvC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# JPA & Hibernate Settings
# In production, Flyway controls migrations and Hibernate validates
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=12
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Flyway Database Migration
# -------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# -------------------------------------------------------------------
# Thymeleaf Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.campus.events=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO

# -------------------------------------------------------------------
# Security / Session Settings
# -------------------------------------------------------------------
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false
